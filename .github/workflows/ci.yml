name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm demo:typecheck
      - run: pnpm test
      - run: pnpm demo:test
      - run: pnpm test:ui
      - run: pnpm build:ui
      - run: python3 -m unittest discover -s bench/retrieval -p 'test_dense.py'
